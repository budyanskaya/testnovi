<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр: Имитационное моделирование</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --success: #2ecc71;
            --success-bg: #d5f5e3;
            --error: #e74c3c;
            --error-bg: #fadbd8;
            --border: #ddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hidden { display: none !important; }

        /* Header & Progress */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-light);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question Area */
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover {
            border-color: var(--primary);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #e3f2fd;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
        }

        .option-btn.incorrect {
            border-color: var(--error);
            background: var(--error-bg);
        }
        
        .option-btn.disabled {
            cursor: not-allowed;
        }

        .marker {
            font-weight: bold;
            width: 20px;
        }

        .marker.correct { color: var(--success); }
        .marker.incorrect { color: var(--error); }

        /* Select & Matching */
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid var(--border);
            font-size: 16px;
            margin-bottom: 10px;
            background: #fff;
        }

        .match-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .match-row select {
            margin-bottom: 0;
            flex: 1;
        }

        .match-row .term {
            flex: 1;
            font-weight: 600;
        }

        .sequence-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .sequence-row .text {
            flex: 1;
        }
        
        .sequence-row .num-select {
            width: 60px;
            flex-shrink: 0;
        }

        /* Feedback & Actions */
        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 15px;
        }

        .feedback.correct { background: var(--success-bg); border-left: 4px solid var(--success); }
        .feedback.incorrect { background: var(--error-bg); border-left: 4px solid var(--error); }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            color: #fff;
            background: var(--primary);
            flex: 1;
            min-width: 120px;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        .btn-secondary { background: #95a5a6; }
        .btn-danger { background: var(--error); }

        /* Menu Screen */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .stats-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
        }
        
        .stats-box ul {
            margin-top: 10px;
            padding-left: 20px;
        }
        
        .stats-box li { margin-bottom: 5px; }

        .topic-list label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .topic-list input[type="checkbox"] {
            margin-right: 8px;
        }

        .tag {
            font-size: 12px;
            background: #eee;
            padding: 4px 8px;
            border-radius: 12px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .tag-hard { background: #ffca28; color: #333; }
    </style>
</head>
<body>

<div id="app">
    <!-- MENU SCREEN -->
    <div id="menu-screen">
        <h2 style="text-align: center; margin-bottom: 10px;">Имитационное моделирование</h2>
        <p style="text-align: center; color: var(--text-light); margin-bottom: 20px; font-size: 14px;">Интерактивный тренажёр для запоминания</p>
        
        <div class="menu-grid">
            <button onclick="startMode('all')">Все вопросы</button>
            <button onclick="startMode('errors')">Работа над ошибками</button>
            <button onclick="startMode('hard')">Сложные вопросы</button>
            <button onclick="startMode('exam')">Экзамен</button>
        </div>

        <div style="margin-top: 15px;">
            <details>
                <summary style="cursor: pointer; font-weight: 600; padding: 10px; background: #eee; border-radius: 8px;">Выбрать темы для повторения</summary>
                <div class="topic-list" id="topic-list" style="margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 8px;">
                    <!-- Заполняется через JS -->
                </div>
                <button onclick="startMode('topics')" style="margin-top: 10px;">Начать по выбранным темам</button>
            </details>
        </div>

        <div class="stats-box" id="global-stats" style="margin-top: 20px;">
            <!-- Заполняется через JS -->
        </div>

        <button onclick="resetProgress()" class="btn-danger" style="margin-top: 20px; width: 100%;">Сбросить весь прогресс</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden">
        <div class="header">
            <span id="q-counter">Вопрос 1 из 10</span>
            <button id="btn-finish" class="btn-secondary" style="padding: 5px 10px; font-size: 12px; flex: none; min-width: auto;" onclick="finishEarly()">Завершить</button>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        
        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
            <span class="tag" id="q-topic">Тема</span>
            <button id="btn-hard" onclick="toggleHard()" style="padding: 2px 8px; font-size: 12px; flex: none; background: transparent; color: var(--text-light); border: 1px solid var(--border);">Отметить сложным</button>
        </div>

        <div class="question-text" id="q-text">Текст вопроса</div>
        <div id="q-input-area"></div>
        
        <div class="feedback hidden" id="feedback-box"></div>

        <div class="actions">
            <button id="btn-prev" onclick="prevQuestion()" class="btn-secondary">Назад</button>
            <button id="btn-skip" onclick="skipQuestion()" class="btn-secondary">Пропустить</button>
            <button id="btn-check" onclick="checkAnswer()" class="hidden">Проверить</button>
            <button id="btn-next" onclick="nextQuestion()" class="hidden">Далее</button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="hidden">
        <h2 style="text-align: center; margin-bottom: 20px;">Результаты</h2>
        <div class="stats-box" id="result-stats"></div>
        <div id="result-errors" style="margin-top: 20px;"></div>
        
        <div class="actions" style="margin-top: 20px;">
            <button onclick="startMode('errors')">Повторить ошибки</button>
            <button onclick="startMode('all')">Пройти заново</button>
            <button onclick="showMenu()" class="btn-secondary">В меню</button>
        </div>
    </div>
</div>

<script>

    // --- ЛОГИКА ТРЕНАЖЁРА ---
    let currentQuestions = [];
    let currentIndex = 0;
    let sessionAnswers = {}; // { qId: { answered: true, isCorrect: bool } }
    let sessionMode = 'all';
    let isExamMode = false;

    // --- LOCALSTORAGE ---
    function getStats() {
        let s = localStorage.getItem('im_stats');
        if (!s) {
            s = { attempts: 0, correct: 0, wrong: 0, history: {}, hard: [] };
            localStorage.setItem('im_stats', JSON.stringify(s));
        } else {
            s = JSON.parse(s);
        }
        // Ensure defaults for history if empty
        if (!s.history) s.history = {};
        if (!s.hard) s.hard = [];
        return s;
    }

    function saveStats(s) {
        try {
            localStorage.setItem('im_stats', JSON.stringify(s));
        } catch(e) {
            alert("Не удалось сохранить прогресс. Возможно, переполнено хранилище.");
        }
    }

    // --- UI UTILS ---
    function showScreen(id) {
        ['menu-screen', 'quiz-screen', 'results-screen'].forEach(s => {
            document.getElementById(s).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }

    function shuffle(arr) {
        let a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // --- INIT MENU ---
    function initMenu() {
        // Topics
        const topics = [...new Set(QUESTIONS.map(q => q.topic))];
        let topicHtml = '';
        topics.forEach(t => {
            topicHtml += `<label><input type="checkbox" value="${t}" class="topic-cb"> ${t}</label>`;
        });
        document.getElementById('topic-list').innerHTML = topicHtml;
        
        // Stats
        let stats = getStats();
        let html = `<h3>Общая статистика</h3>
                    <ul>
                        <li>Прогонов: ${stats.attempts}</li>
                        <li>Правильных ответов: ${stats.correct}</li>
                        <li>Неправильных ответов: ${stats.wrong}</li>
                    </ul>`;
        document.getElementById('global-stats').innerHTML = html;
    }

    // --- START MODE ---
    function startMode(mode) {
        let stats = getStats();
        let pool = [];

        if (mode === 'all') {
            pool = QUESTIONS;
            isExamMode = false;
        } else if (mode === 'exam') {
            pool = QUESTIONS;
            isExamMode = true;
        } else if (mode === 'errors') {
            // Вопросы, которые были неправильно отвечены в прошлый раз (по истории)
            let errorIds = Object.keys(stats.history).filter(id => stats.history[id].lastCorrect === false);
            if (errorIds.length === 0) {
                alert("Нет ошибок для повторения!");
                return;
            }
            pool = QUESTIONS.filter(q => errorIds.includes(String(q.id)));
            isExamMode = false;
        } else if (mode === 'hard') {
            if (stats.hard.length === 0) {
                alert("Нет отмеченных сложных вопросов!");
                return;
            }
            pool = QUESTIONS.filter(q => stats.hard.includes(q.id));
            isExamMode = false;
        } else if (mode === 'topics') {
            let selected = Array.from(document.querySelectorAll('.topic-cb:checked')).map(cb => cb.value);
            if (selected.length === 0) {
                alert("Выберите хотя бы одну тему!");
                return;
            }
            pool = QUESTIONS.filter(q => selected.includes(q.topic));
            isExamMode = false;
        }

        // Shuffle questions
        currentQuestions = shuffle(pool).map(q => {
            let newQ = JSON.parse(JSON.stringify(q)); // Deep copy
            // Shuffle options for single/multi
            if (newQ.type === 'single' || newQ.type === 'multi') {
                let correctText = newQ.type === 'single' ? newQ.options[newQ.correct] : newQ.correct.map(i => newQ.options[i]);
                let shuffledOptions = shuffle(newQ.options);
                newQ.options = shuffledOptions;
                if (newQ.type === 'single') {
                    newQ.correct = shuffledOptions.indexOf(correctText);
                } else {
                    newQ.correct = correctText.map(text => shuffledOptions.indexOf(text));
                }
            }
            // Shuffle matching pairs
            if (newQ.type === 'matching') {
                newQ.pairs = shuffle(newQ.pairs);
            }
            // Shuffle sequence items
            if (newQ.type === 'sequence') {
                newQ.items = shuffle(newQ.items);
            }
            // Shuffle category items
            if (newQ.type === 'category') {
                newQ.items = shuffle(newQ.items);
            }
            return newQ;
        });

        currentIndex = 0;
        sessionAnswers = {};
        sessionMode = mode;
        stats.attempts++;
        saveStats(stats);
        
        showScreen('quiz-screen');
        renderQuestion();
    }

    function showMenu() {
        showScreen('menu-screen');
        initMenu();
    }

    // --- RENDER QUESTION ---
    function renderQuestion() {
        if (currentIndex >= currentQuestions.length) {
            finishQuiz();
            return;
        }

        let q = currentQuestions[currentIndex];
        let stats = getStats();
        
        // Header
        document.getElementById('q-counter').innerText = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
        document.getElementById('progress-fill').style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
        document.getElementById('q-topic').innerText = q.topic;
        
        // Hard button
        let btnHard = document.getElementById('btn-hard');
        if (stats.hard.includes(q.id)) {
            btnHard.innerText = "Отмечено сложным ★";
            btnHard.style.color = "#ffca28";
            btnHard.style.fontWeight = "bold";
        } else {
            btnHard.innerText = "Отметить сложным";
            btnHard.style.color = "#666";
            btnHard.style.fontWeight = "normal";
        }

        // Text
        document.getElementById('q-text').innerText = q.text;

        // Input Area
        let area = document.getElementById('q-input-area');
        area.innerHTML = '';
        
        let answered = sessionAnswers[q.id] && sessionAnswers[q.id].answered;
        let isExam = isExamMode;

        if (q.type === 'single') {
            let container = document.createElement('div');
            container.className = 'options-container';
            q.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                if (answered) {
                    btn.disabled = true;
                    btn.classList.add('disabled');
                    if (sessionAnswers[q.id].selected.includes(idx)) {
                        btn.classList.add(idx === q.correct ? 'correct' : 'incorrect');
                        btn.innerHTML = `<span class="marker ${idx === q.correct ? 'correct' : 'incorrect'}">${idx === q.correct ? '✓' : '✗'}</span> ${opt}`;
                    } else if (idx === q.correct && !isExam) {
                        btn.classList.add('correct');
                        btn.innerHTML = `<span class="marker correct">✓</span> ${opt}`;
                    }
                } else {
                    btn.onclick = () => selectSingle(q.id, idx);
                }
                container.appendChild(btn);
            });
            area.appendChild(container);
        } else if (q.type === 'multi') {
            let container = document.createElement('div');
            container.className = 'options-container';
            q.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.dataset.idx = idx;
                if (answered) {
                    btn.disabled = true;
                    btn.classList.add('disabled');
                    let isSel = sessionAnswers[q.id].selected.includes(idx);
                    let isCorr = q.correct.includes(idx);
                    if (isSel) {
                        btn.classList.add(isCorr ? 'correct' : 'incorrect');
                        btn.innerHTML = `<span class="marker ${isCorr ? 'correct' : 'incorrect'}">${isCorr ? '✓' : '✗'}</span> ${opt}`;
                    } else if (isCorr && !isExam) {
                        btn.classList.add('correct');
                        btn.innerHTML = `<span class="marker correct">✓</span> ${opt}`;
                    }
                } else {
                    btn.onclick = () => toggleMulti(q.id, idx, btn);
                }
                container.appendChild(btn);
            });
            area.appendChild(container);
            if (!answered) {
                let checkBtn = document.getElementById('btn-check');
                checkBtn.classList.remove('hidden');
                checkBtn.onclick = () => checkMulti(q);
            }
        } else if (q.type === 'dropdown') {
            let div = document.createElement('div');
            div.innerHTML = q.text;
            area.appendChild(div);
            // Text has [1], [2] markers
            q.blanks.forEach((blank, i) => {
                let sel = document.createElement('select');
                sel.id = `blank-${q.id}-${i}`;
                let opts = shuffle(blank.options);
                opts.forEach((o, oIdx) => {
                    let option = document.createElement('option');
                    option.value = o;
                    option.innerText = o;
                    sel.appendChild(option);
                });
                if (answered) {
                    sel.disabled = true;
                    sel.value = sessionAnswers[q.id].selected[i];
                    let isCorr = sel.value === blank.options[blank.correct];
                    sel.style.borderColor = isCorr ? 'var(--success)' : 'var(--error)';
                    sel.style.background = isCorr ? 'var(--success-bg)' : 'var(--error-bg)';
                    if (!isCorr && !isExam) {
                        let feedback = document.createElement('span');
                        feedback.style.marginLeft = '10px';
                        feedback.style.color = 'var(--success)';
                        feedback.innerText = `(Правильно: ${blank.options[blank.correct]})`;
                        sel.parentNode.insertBefore(feedback, sel.nextSibling);
                    }
                }
                let container = document.createElement('div');
                container.style.marginBottom = '10px';
                container.appendChild(sel);
                area.appendChild(container);
            });
            // Replace text markers
            document.getElementById('q-text').innerHTML = ''; // Hide original text, show in area
            if (!answered) {
                let checkBtn = document.getElementById('btn-check');
                checkBtn.classList.remove('hidden');
                checkBtn.onclick = () => checkDropdown(q);
            }
        } else if (q.type === 'matching') {
            let container = document.createElement('div');
            q.pairs.forEach((pair, idx) => {
                let row = document.createElement('div');
                row.className = 'match-row';
                let termSpan = document.createElement('span');
                termSpan.className = 'term';
                termSpan.innerText = pair.left;
                let sel = document.createElement('select');
                sel.id = `match-${q.id}-${idx}`;
                let opts = shuffle(q.pairs.map(p => p.right));
                opts.forEach((o, oIdx) => {
                    let option = document.createElement('option');
                    option.value = o;
                    option.innerText = o;
                    sel.appendChild(option);
                });
                if (answered) {
                    sel.disabled = true;
                    sel.value = sessionAnswers[q.id].selected[idx];
                    let isCorr = sel.value === pair.right;
                    sel.style.borderColor = isCorr ? 'var(--success)' : 'var(--error)';
                    sel.style.background = isCorr ? 'var(--success-bg)' : 'var(--error-bg)';
                    if (!isCorr && !isExam) {
                        let feedback = document.createElement('span');
                        feedback.style.marginLeft = '10px';
                        feedback.style.color = 'var(--success)';
                        feedback.style.fontSize = '12px';
                        feedback.innerText = `(Правильно: ${pair.right})`;
                        row.appendChild(feedback);
                    }
                }
                row.appendChild(termSpan);
                row.appendChild(sel);
                container.appendChild(row);
            });
            area.appendChild(container);
            if (!answered) {
                let checkBtn = document.getElementById('btn-check');
                checkBtn.classList.remove('hidden');
                checkBtn.onclick = () => checkMatching(q);
            }
        } else if (q.type === 'sequence') {
            let container = document.createElement('div');
            q.items.forEach((item, idx) => {
                let row = document.createElement('div');
                row.className = 'sequence-row';
                let sel = document.createElement('select');
                sel.className = 'num-select';
                sel.id = `seq-${q.id}-${idx}`;
                for (let i = 1; i <= q.items.length; i++) {
                    let option = document.createElement('option');
                    option.value = i;
                    option.innerText = i;
                    sel.appendChild(option);
                }
                if (answered) {
                    sel.disabled = true;
                    sel.value = sessionAnswers[q.id].selected[idx];
                    let isCorr = parseInt(sel.value) === (q.items.indexOf(item) + 1);
                    sel.style.borderColor = isCorr ? 'var(--success)' : 'var(--error)';
                    sel.style.background = isCorr ? 'var(--success-bg)' : 'var(--error-bg)';
                }
                let textSpan = document.createElement('span');
                textSpan.className = 'text';
                textSpan.innerText = item;
                row.appendChild(sel);
                row.appendChild(textSpan);
                container.appendChild(row);
            });
            area.appendChild(container);
            if (!answered) {
                let checkBtn = document.getElementById('btn-check');
                checkBtn.classList.remove('hidden');
                checkBtn.onclick = () => checkSequence(q);
            }
        } else if (q.type === 'category') {
            let container = document.createElement('div');
            q.items.forEach((item, idx) => {
                let row = document.createElement('div');
                row.className = 'match-row';
                let textSpan = document.createElement('span');
                textSpan.className = 'term';
                textSpan.innerText = item.text;
                let sel = document.createElement('select');
                sel.id = `cat-${q.id}-${idx}`;
                q.categories.forEach((cat, cIdx) => {
                    let option = document.createElement('option');
                    option.value = cIdx;
                    option.innerText = cat;
                    sel.appendChild(option);
                });
                if (answered) {
                    sel.disabled = true;
                    sel.value = sessionAnswers[q.id].selected[idx];
                    let isCorr = parseInt(sel.value) === item.cat;
                    sel.style.borderColor = isCorr ? 'var(--success)' : 'var(--error)';
                    sel.style.background = isCorr ? 'var(--success-bg)' : 'var(--error-bg)';
                }
                row.appendChild(textSpan);
                row.appendChild(sel);
                container.appendChild(row);
            });
            area.appendChild(container);
            if (!answered) {
                let checkBtn = document.getElementById('btn-check');
                checkBtn.classList.remove('hidden');
                checkBtn.onclick = () => checkCategory(q);
            }
        }

        // Show Feedback if answered
        let feedbackBox = document.getElementById('feedback-box');
        feedbackBox.classList.add('hidden');
        if (answered) {
            let isCorrect = sessionAnswers[q.id].isCorrect;
            let resText = isCorrect ? 'Верно' : 'Неверно';
            if (isExam && !isCorrect) resText = 'Неверно'; // In exam mode, show correct answer only at the end, but feedback is just a marker
            if (!isExam) {
                feedbackBox.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
                feedbackBox.innerHTML = `<strong>${resText}</strong><br>${q.explanation || ''}`;
                feedbackBox.classList.remove('hidden');
            } else {
                // In exam mode, we don't show explanation, just a subtle mark
                feedbackBox.className = 'feedback';
                feedbackBox.innerHTML = '';
                feedbackBox.classList.add('hidden');
            }
        }

        // Buttons
        document.getElementById('btn-prev').style.display = currentIndex > 0 ? 'block' : 'none';
        document.getElementById('btn-skip').style.display = (!answered && !isExam) ? 'block' : 'none';
        document.getElementById('btn-check').classList.add('hidden'); // Reset
        document.getElementById('btn-next').classList.add('hidden');
        
        if (answered) {
            document.getElementById('btn-check').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            // If it's the last question, change text
            if (currentIndex === currentQuestions.length - 1) {
                document.getElementById('btn-next').innerText = 'Завершить';
            } else {
                document.getElementById('btn-next').innerText = 'Далее';
            }
            document.getElementById('btn-next').onclick = nextQuestion;
        } else if (q.type === 'single') {
            // single checks immediately, so next button will show after check
        }
    }

    // --- ANSWER HANDLERS ---
    function selectSingle(qId, idx) {
        let q = currentQuestions.find(x => x.id === qId);
        let isCorrect = idx === q.correct;
        sessionAnswers[qId] = { answered: true, isCorrect: isCorrect, selected: [idx] };
        
        // Update stats
        updateGlobalStats(qId, isCorrect);
        
        renderQuestion(); // Re-render to show result
    }

    function toggleMulti(qId, idx, btn) {
        btn.classList.toggle('selected');
    }

    function checkMulti(q) {
        let selected = [];
        document.querySelectorAll('#q-input-area .option-btn').forEach((btn, i) => {
            if (btn.classList.contains('selected')) selected.push(i);
        });
        if (selected.length === 0) return alert("Выберите хотя бы один вариант!");
        
        let isCorrect = selected.length === q.correct.length && selected.every(i => q.correct.includes(i));
        sessionAnswers[q.id] = { answered: true, isCorrect: isCorrect, selected: selected };
        updateGlobalStats(q.id, isCorrect);
        renderQuestion();
    }

    function checkDropdown(q) {
        let selected = [];
        let allFilled = true;
        q.blanks.forEach((b, i) => {
            let sel = document.getElementById(`blank-${q.id}-${i}`);
            selected.push(sel.value);
        });
        
        let isCorrect = true;
        q.blanks.forEach((b, i) => {
            if (selected[i] !== b.options[b.correct]) isCorrect = false;
        });
        
        sessionAnswers[q.id] = { answered: true, isCorrect: isCorrect, selected: selected };
        updateGlobalStats(q.id, isCorrect);
        renderQuestion();
    }

    function checkMatching(q) {
        let selected = [];
        q.pairs.forEach((p, i) => {
            let sel = document.getElementById(`match-${q.id}-${i}`);
            selected.push(sel.value);
        });
        
        let isCorrect = true;
        q.pairs.forEach((p, i) => {
            if (selected[i] !== p.right) isCorrect = false;
        });
        
        sessionAnswers[q.id] = { answered: true, isCorrect: isCorrect, selected: selected };
        updateGlobalStats(q.id, isCorrect);
        renderQuestion();
    }

    function checkSequence(q) {
        let selected = [];
        q.items.forEach((item, i) => {
            let sel = document.getElementById(`seq-${q.id}-${i}`);
            selected.push(parseInt(sel.value));
        });
        
        let isCorrect = true;
        q.items.forEach((item, i) => {
            if (selected[i] !== (q.items.indexOf(item) + 1)) isCorrect = false;
        });
        
        sessionAnswers[q.id] = { answered: true, isCorrect: isCorrect, selected: selected };
        updateGlobalStats(q.id, isCorrect);
        renderQuestion();
    }

    function checkCategory(q) {
        let selected = [];
        q.items.forEach((item, i) => {
            let sel = document.getElementById(`cat-${q.id}-${i}`);
            selected.push(parseInt(sel.value));
        });
        
        let isCorrect = true;
        q.items.forEach((item, i) => {
            if (selected[i] !== item.cat) isCorrect = false;
        });
        
        sessionAnswers[q.id] = { answered: true, isCorrect: isCorrect, selected: selected };
        updateGlobalStats(q.id, isCorrect);
        renderQuestion();
    }

    // --- STATS UPDATE ---
    function updateGlobalStats(qId, isCorrect) {
        let stats = getStats();
        if (isCorrect) stats.correct++;
        else stats.wrong++;
        
        if (!stats.history[qId]) stats.history[qId] = { correct: 0, wrong: 0, lastCorrect: null };
        if (isCorrect) stats.history[qId].correct++;
        else stats.history[qId].wrong++;
        stats.history[qId].lastCorrect = isCorrect;
        
        saveStats(stats);
    }

    // --- NAVIGATION ---
    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= currentQuestions.length) {
            finishQuiz();
        } else {
            renderQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function skipQuestion() {
        nextQuestion();
    }

    function toggleHard() {
        let q = currentQuestions[currentIndex];
        let stats = getStats();
        let idx = stats.hard.indexOf(q.id);
        if (idx > -1) {
            stats.hard.splice(idx, 1);
        } else {
            stats.hard.push(q.id);
        }
        saveStats(stats);
        renderQuestion();
    }

    function finishEarly() {
        if (confirm("Вы уверены, что хотите завершить?")) {
            finishQuiz();
        }
    }

    function finishQuiz() {
        showScreen('results-screen');
        
        let total = currentQuestions.length;
        let correctCount = 0;
        let errorsHtml = '';
        let topicStats = {};
        
        currentQuestions.forEach(q => {
            let ans = sessionAnswers[q.id];
            if (ans && ans.isCorrect) {
                correctCount++;
                if (!topicStats[q.topic]) topicStats[q.topic] = { c: 0, t: 0 };
                topicStats[q.topic].c++;
            } else {
                errorsHtml += `<li style="margin-bottom:10px;">
                    <strong>Вопрос:</strong> ${q.text}<br>
                    <span style="color: var(--error);">Ваш ответ: ${ans ? 'неверно' : 'пропущен'}</span><br>
                    <span style="color: var(--success);">Правильный ответ: ${getCorrectAnswerText(q)}</span>
                    <div style="font-size: 13px; color: #666; margin-top: 5px;">${q.explanation || ''}</div>
                </li>`;
            }
            if (!topicStats[q.topic]) topicStats[q.topic] = { c: 0, t: 0 };
            topicStats[q.topic].t++;
        });

        let percent = Math.round((correctCount / total) * 100);
        
        let statsHtml = `<h3>Результат: ${correctCount} из ${total} (${percent}%)</h3>`;
        statsHtml += `<p>Темы:</p><ul>`;
        for (let t in topicStats) {
            statsHtml += `<li>${t}: ${topicStats[t].c} из ${topicStats[t].t}</li>`;
        }
        statsHtml += `</ul>`;
        
        document.getElementById('result-stats').innerHTML = statsHtml;
        
        if (errorsHtml) {
            document.getElementById('result-errors').innerHTML = `<h4>Ошибки:</h4><ul>${errorsHtml}</ul>`;
        } else {
            document.getElementById('result-errors').innerHTML = `<p style="color: var(--success); font-weight: bold;">Все ответы верны!</p>`;
        }
    }

    function getCorrectAnswerText(q) {
        if (q.type === 'single') return q.options[q.correct];
        if (q.type === 'multi') return q.correct.map(i => q.options[i]).join(', ');
        if (q.type === 'dropdown') return q.blanks.map(b => b.options[b.correct]).join(', ');
        if (q.type === 'matching') return q.pairs.map(p => `${p.left} → ${p.right}`).join('; ');
        if (q.type === 'sequence') return q.items.map((item, i) => `${i+1}. ${item}`).join('; ');
        if (q.type === 'category') return q.items.map((item, i) => `${item.text} → ${q.categories[item.cat]}`).join('; ');
        return '';
    }

    function resetProgress() {
        if (confirm("Вы уверены, что хотите сбросить весь прогресс? Это действие необратимо.")) {
            localStorage.removeItem('im_stats');
            initMenu();
            alert("Прогресс сброшен.");
        }
    }

    // --- INIT ON LOAD ---
    window.onload = initMenu;

</script>
