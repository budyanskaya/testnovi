<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Имитационное моделирование | Тренажёр</title>
    <style>
        :root {
            --bg: #F5F5F7;
            --card: #FFFFFF;
            --card-secondary: #FAFAFC;
            --text: #1D1D1F;
            --text-muted: #86868B;
            --border: #D2D2D7;
            --border-active: #86868B;
            --primary: #0071E3;
            --primary-hover: #0077ED;
            --success: #34C759;
            --success-bg: #EBF9EE;
            --error: #FF3B30;
            --error-bg: #FFF0EF;
            --radius: 12px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 16px;
        }

        #app {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hidden { display: none !important; }

        /* Typography */
        h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.02em; }
        h1 { font-size: 28px; margin-bottom: 8px; text-align: center; color: var(--text); }
        h2 { font-size: 22px; margin-bottom: 16px; text-align: center; }
        p { color: var(--text-muted); font-size: 15px; }

        /* Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo-text {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .header-nav {
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        button {
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            outline: none;
            padding: 12px 20px;
        }

        button:active { transform: scale(0.98); }

        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
        }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { background: #E5E5EA; color: #AEAEB2; cursor: not-allowed; }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--border-active); background: var(--bg); }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-text {
            background: transparent;
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 15px;
            font-weight: 500;
        }
        .btn-text:hover { color: var(--text); }

        .btn-danger {
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
        }
        .btn-danger:hover { background: var(--error-bg); }

        /* Menu Screen */
        .menu-card {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .stats-panel {
            background: var(--card-secondary);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            font-size: 14px;
        }
        
        .stats-panel ul { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .stats-panel li { display: flex; justify-content: space-between; color: var(--text-muted); }
        .stats-panel li span { color: var(--text); font-weight: 600; }

        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .topic-list label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 15px;
        }
        .topic-list input[type="checkbox"] {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-active);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .topic-list input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }
        .topic-list input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 3px; left: 7px;
            width: 5px; height: 10px;
            border: solid #FFF;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Quiz Screen */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #E5E5EA;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .tags-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .tag {
            font-size: 12px;
            background: var(--card-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--text-muted);
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .hard-btn.active {
            color: #FF9500;
            border-color: #FF9500;
            background: rgba(255, 149, 0, 0.1);
        }

        .question-text {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 24px;
            color: var(--text);
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--border-active);
            background: var(--card-secondary);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: rgba(0, 113, 227, 0.05);
            color: var(--primary);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
            color: var(--success);
        }

        .option-btn.incorrect {
            border-color: var(--error);
            background: var(--error-bg);
            color: var(--error);
        }

        .option-btn.disabled {
            cursor: default;
        }

        .checkbox-mock {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-active);
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            background: var(--card);
        }

        .option-btn.selected .checkbox-mock {
            background: var(--primary);
            border-color: var(--primary);
        }
        .option-btn.selected .checkbox-mock::after {
            content: '✓';
            color: #FFF;
            font-size: 14px;
            font-weight: bold;
        }

        .option-btn.correct .checkbox-mock { border-color: var(--success); background: var(--success); }
        .option-btn.correct .checkbox-mock::after { content: '✓'; color: #FFF; font-size: 14px; font-weight: bold; }
        .option-btn.incorrect .checkbox-mock { border-color: var(--error); background: var(--error); }
        .option-btn.incorrect .checkbox-mock::after { content: '✕'; color: #FFF; font-size: 12px; font-weight: bold; }

        .marker-icon {
            font-size: 18px;
            font-weight: bold;
            margin-left: auto;
        }

        /* Dropdowns & Matching */
        select {
            width: 100%;
            padding: 14px 16px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 16px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            transition: border-color 0.2s;
        }

        select:focus { border-color: var(--primary); }
        select:disabled { opacity: 0.7; cursor: default; }
        select.correct-select { border-color: var(--success); background-color: var(--success-bg); color: var(--success); }
        select.incorrect-select { border-color: var(--error); background-color: var(--error-bg); color: var(--error); }

        .dropdown-block { margin-bottom: 12px; }
        .dropdown-hint { font-size: 14px; color: var(--success); margin-top: 6px; display: block; font-weight: 500; }

        .match-row, .sequence-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            background: var(--card-secondary);
            padding: 12px;
            border-radius: var(--radius);
            border: 2px solid transparent;
        }

        .match-row .term, .sequence-row .text {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
        }

        .match-row select, .sequence-row select {
            flex: 1;
            min-width: 120px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .sequence-row select.num-select { flex: none; width: 70px; }
        
        .match-row.has-error, .sequence-row.has-error { border-color: var(--error); background: var(--error-bg); }
        .match-row.is-correct, .sequence-row.is-correct { border-color: var(--success); background: var(--success-bg); }

        /* Feedback */
        .feedback-box {
            padding: 16px;
            border-radius: var(--radius);
            margin-top: 20px;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-box.correct { background: var(--success-bg); border: 2px solid rgba(52, 199, 89, 0.3); }
        .feedback-box.incorrect { background: var(--error-bg); border: 2px solid rgba(255, 59, 48, 0.3); }
        
        .feedback-title { font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-size: 16px; }
        .feedback-title.correct { color: var(--success); }
        .feedback-title.incorrect { color: var(--error); }
        .feedback-text { color: var(--text); font-size: 14px; line-height: 1.4; }

        /* Actions */
        .actions-bar {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .actions-bar button { flex: 1; min-width: 120px; }

        /* Results */
        .result-main {
            text-align: center;
            padding: 32px 20px;
            background: var(--card);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }

        .result-percent {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .result-subtitle { color: var(--text-muted); font-size: 16px; font-weight: 500; }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .result-grid { grid-template-columns: 1fr 1fr; }
        }

        .result-item {
            background: var(--card);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
        }

        .result-item .val { font-size: 24px; font-weight: 700; }
        .result-item .lbl { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; font-weight: 600; }

        .error-list {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }
        
        .error-list h4 { margin-bottom: 16px; font-size: 18px; }
        
        .error-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .error-item:last-child { border-bottom: none; }
        .error-q { font-weight: 600; margin-bottom: 8px; font-size: 15px; }
        .error-ans { font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
        .error-ans span.correct { color: var(--success); font-weight: 500; }

        /* Utilities */
        .spacer { height: 10px; }
        .mt-20 { margin-top: 20px; }
        .w-100 { width: 100%; }
        
        details summary {
            cursor: pointer;
            padding: 14px;
            background: var(--card-secondary);
            border-radius: var(--radius);
            font-weight: 600;
            list-style: none;
            border: 1px solid var(--border);
            color: var(--text);
        }
        details summary::-webkit-details-marker { display: none; }
        details[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; border-bottom: none; }
        details > div { padding: 16px; background: var(--card); border: 1px solid var(--border); border-top: none; border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); }
    </style>
</head>
<body>

<div id="app">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo-text">ИМ · Тренажёр</div>
        <div class="header-nav">
            <button class="btn-text" onclick="showMenu()">Меню</button>
        </div>
    </div>

    <!-- MENU SCREEN -->
    <div id="menu-screen" class="hidden">
        <div class="menu-card">
            <h1>Имитационное моделирование</h1>
            <p style="text-align: center; margin-bottom: 16px;">Интерактивный тренажёр для запоминания материала</p>
            
            <div class="menu-grid">
                <button class="btn-primary" onclick="startMode('all')">Все вопросы</button>
                <button class="btn-secondary" onclick="startMode('errors')">Работа над ошибками</button>
                <button class="btn-secondary" onclick="startMode('hard')">Сложные вопросы</button>
                <button class="btn-secondary" onclick="startMode('exam')">Режим экзамена</button>
            </div>

            <div class="spacer"></div>

            <details>
                <summary>Выбрать темы для повторения</summary>
                <div>
                    <div class="topic-list" id="topic-list">
                        <!-- JS generated -->
                    </div>
                    <button class="btn-primary w-100 mt-20" onclick="startMode('topics')">Начать по выбранным темам</button>
                </div>
            </details>

            <div class="stats-panel" id="global-stats">
                <!-- JS generated -->
            </div>

            <button class="btn-danger w-100 mt-20" onclick="resetProgress()">Сбросить весь прогресс</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden">
        <div class="quiz-header">
            <span id="q-counter">Вопрос 1 из 10</span>
            <button class="btn-text" onclick="finishEarly()">Завершить</button>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-fill"></div>
        </div>
        
        <div class="tags-row">
            <span class="tag" id="q-topic">Тема</span>
            <button class="btn-text tag hard-btn" id="btn-hard" onclick="toggleHard()">Отметить сложным</button>
        </div>

        <div class="question-text" id="q-text">Текст вопроса</div>
        <div id="q-input-area"></div>
        
        <div class="feedback-box hidden" id="feedback-box"></div>

        <div class="actions-bar">
            <button class="btn-secondary" id="btn-prev" onclick="prevQuestion()">Назад</button>
            <button class="btn-secondary" id="btn-skip" onclick="skipQuestion()">Пропустить</button>
            <button class="btn-primary hidden" id="btn-check" onclick="checkCurrentAnswer()">Проверить ответ</button>
            <button class="btn-primary hidden" id="btn-next" onclick="nextQuestion()">Далее</button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="hidden">
        <div class="result-main">
            <div class="result-percent" id="res-percent">0%</div>
            <div class="result-subtitle" id="res-subtitle">Результат</div>
        </div>
        
        <div class="result-grid">
            <div class="result-item">
                <div class="val" id="res-correct" style="color:var(--success)">0</div>
                <div class="lbl">Верно</div>
            </div>
            <div class="result-item">
                <div class="val" id="res-incorrect" style="color:var(--error)">0</div>
                <div class="lbl">Ошибки</div>
            </div>
            <div class="result-item">
                <div class="val" id="res-skipped">0</div>
                <div class="lbl">Пропущено</div>
            </div>
            <div class="result-item">
                <div class="val" id="res-unchecked">0</div>
                <div class="lbl">Не проверено</div>
            </div>
        </div>

        <div class="error-list hidden" id="result-errors-container">
            <h4>Разбор ошибок</h4>
            <div id="result-errors"></div>
        </div>
        
        <div class="actions-bar" style="margin-top: 24px;">
            <button class="btn-secondary" onclick="startMode('errors')">Повторить ошибки</button>
            <button class="btn-primary" onclick="startMode('all')">Пройти заново</button>
            <button class="btn-secondary" onclick="showMenu()">В меню</button>
        </div>
    </div>
</div>

<script>
    // --- БАЗА ВОПРОСОВ ---
    const QUESTIONS = [
        {
            id: 1, topic: "Основные понятия", type: "single",
            text: "Что определяется как «сущность в виртуальном пространстве, обладающая определенным состоянием и поведением, имеющая заданные значения свойств (атрибутов) и операций над ними»?",
            options: ["Объект", "Класс", "Система", "Агент"],
            correct: "Объект",
            explanation: "Слайд 3. Именно такое определение даётся понятию «Объект» в объектно-ориентированном подходе."
        },
        {
            id: 2, topic: "Основные понятия", type: "single",
            text: "Как называется простейшая неделимая часть системы, свойства которой определяются конкретной задачей?",
            options: ["Компонент", "Элемент", "Подсистема", "Структура"],
            correct: "Элемент",
            explanation: "Слайд 5. Элемент — простейшая неделимая часть. Компонент — объединение элементов (масштаб меньше системы)."
        },
        {
            id: 3, topic: "Основные понятия", type: "single",
            text: "Что из перечисленного НЕ относится к свойствам, которыми должен обладать объект, считающийся системой?",
            options: ["Целостность", "Делимость", "Стохастичность", "Эмерджентность"],
            correct: "Стохастичность",
            explanation: "Слайд 4. Свойства системы: целостность, делимость, наличие устойчивых связей, организация и эмерджентность. Стохастичность не является обязательным свойством."
        },
        {
            id: 4, topic: "Основные понятия", type: "multi",
            text: "Выберите все характеристики, которые относятся к понятию «Процесс» (слайд 10):",
            options: ["Логически связанный набор работ", "Мгновенное изменение состояния", "Характеризуется длительностью и потребляемыми ресурсами", "Имеет нулевую длительность"],
            correct: ["Логически связанный набор работ", "Характеризуется длительностью и потребляемыми ресурсами"],
            explanation: "Слайд 10. Процесс — логически связанный набор работ, характеризуется длительностью, результатом, ресурсами, условиями запуска/остановки. Мгновенное изменение — это событие (слайд 12)."
        },
        {
            id: 5, topic: "Основные понятия", type: "single",
            text: "Что представляет собой «Транзакт» в имитационном моделировании?",
            options: ["Сообщение (заявка на обслуживание), поступающее извне", "Мгновенное изменение состояния системы", "Единичное действие по обработке данных", "Совокупность устойчивых связей"],
            correct: "Сообщение (заявка на обслуживание), поступающее извне",
            explanation: "Слайд 13. Транзакт — это сообщение (заявка на обслуживание), проходящее по системе и активирующее процессы."
        },
        {
            id: 6, topic: "Классификация систем", type: "single",

    // --- STATE ---
    let currentQuestions = [];
    let currentIndex = 0;
    let sessionAnswers = {}; // qId -> { status, selected, isCorrect }
    let isExamMode = false;

    // --- LOCALSTORAGE ---
    function getStats() {
        let s = localStorage.getItem('im_stats_v3');
        if (!s) {
            s = { attempts: 0, totalCorrect: 0, totalWrong: 0, history: {}, hard: [] };
            localStorage.setItem('im_stats_v3', JSON.stringify(s));
        } else {
            s = JSON.parse(s);
        }
        if (!s.history) s.history = {};
        if (!s.hard) s.hard = [];
        return s;
    }

    function saveStats(s) {
        try {
            localStorage.setItem('im_stats_v3', JSON.stringify(s));
        } catch(e) {
            console.warn("Не удалось сохранить прогресс.");
        }
    }

    // --- UTILS ---
    function shuffle(arr) {
        let a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function showScreen(id) {
        ['menu-screen', 'quiz-screen', 'results-screen'].forEach(s => {
            document.getElementById(s).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }

    // --- INIT ---
    function initMenu() {
        showScreen('menu-screen');
        
        // Topics
        const topics = [...new Set(QUESTIONS.map(q => q.topic))];
        let topicHtml = '';
        topics.forEach(t => {
            topicHtml += `<label><input type="checkbox" value="${t}" class="topic-cb"> ${t}</label>`;
        });
        document.getElementById('topic-list').innerHTML = topicHtml;
        
        // Stats
        let stats = getStats();
        let html = `<h4>Общая статистика</h4>
                    <ul>
                        <li>Прогонов: <span>${stats.attempts}</span></li>
                        <li>Всего верных: <span>${stats.totalCorrect}</span></li>
                        <li>Всего ошибок: <span>${stats.totalWrong}</span></li>
                    </ul>`;
        document.getElementById('global-stats').innerHTML = html;
    }

    // --- START MODE ---
    function startMode(mode) {
        let stats = getStats();
        let pool = [];

        if (mode === 'all') {
            pool = QUESTIONS;
            isExamMode = false;
        } else if (mode === 'exam') {
            pool = QUESTIONS;
            isExamMode = true;
        } else if (mode === 'errors') {
            let errorIds = Object.keys(stats.history).filter(id => stats.history[id].lastCorrect === false);
            if (errorIds.length === 0) return alert("Нет ошибок для повторения!");
            pool = QUESTIONS.filter(q => errorIds.includes(String(q.id)));
            isExamMode = false;
        } else if (mode === 'hard') {
            if (stats.hard.length === 0) return alert("Нет отмеченных сложных вопросов!");
            pool = QUESTIONS.filter(q => stats.hard.includes(q.id));
            isExamMode = false;
        } else if (mode === 'topics') {
            let selected = Array.from(document.querySelectorAll('.topic-cb:checked')).map(cb => cb.value);
            if (selected.length === 0) return alert("Выберите хотя бы одну тему!");
            pool = QUESTIONS.filter(q => selected.includes(q.topic));
            isExamMode = false;
        }

        // Deep copy & Shuffle
        currentQuestions = shuffle(pool).map(q => {
            let newQ = JSON.parse(JSON.stringify(q));
            if (newQ.type === 'single' || newQ.type === 'multi') {
                newQ.options = shuffle(newQ.options);
            }
            if (newQ.type === 'matching') {
                newQ.pairs = shuffle(newQ.pairs);
            }
            if (newQ.type === 'sequence') {
                newQ.items = shuffle(newQ.items);
            }
            if (newQ.type === 'category') {
                newQ.items = shuffle(newQ.items);
            }
            return newQ;
        });

        currentIndex = 0;
        sessionAnswers = {};
        stats.attempts++;
        saveStats(stats);
        
        showScreen('quiz-screen');
        renderQuestion();
    }

    // --- RENDER ---
    function renderQuestion() {
        if (currentIndex >= currentQuestions.length) return finishQuiz();

        let q = currentQuestions[currentIndex];
        let stats = getStats();
        let ans = sessionAnswers[q.id] || { status: 'unanswered' };
        let isAnswered = ans.status !== 'unanswered';
        let isChecked = ans.status === 'correct' || ans.status === 'incorrect';

        // Header
        document.getElementById('q-counter').innerText = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
        document.getElementById('progress-fill').style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
        document.getElementById('q-topic').innerText = q.topic;
        
        // Hard Btn
        let btnHard = document.getElementById('btn-hard');
        if (stats.hard.includes(q.id)) {
            btnHard.classList.add('active');
            btnHard.innerText = "★ Сложный";
        } else {
            btnHard.classList.remove('active');
            btnHard.innerText = "Отметить сложным";
        }

        // Question Text
        let qText = document.getElementById('q-text');
        if (q.type === 'dropdown') {
            qText.innerHTML = ''; // Text handled in input area
        } else {
            qText.innerText = q.text;
        }

        // Input Area
        let area = document.getElementById('q-input-area');
        area.innerHTML = '';
        
        // Render by type
        if (q.type === 'single') {
            let container = document.createElement('div');
            container.className = 'options-container';
            q.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                if (ans.selected && ans.selected.includes(opt)) btn.classList.add('selected');
                
                if (isChecked) {
                    btn.disabled = true;
                    btn.classList.add('disabled');
                    if (opt === q.correct) {
                        btn.classList.add('correct');
                        btn.innerHTML = `<span>${opt}</span><span class="marker-icon">✓</span>`;
                    } else if (ans.selected && ans.selected.includes(opt)) {
                        btn.classList.add('incorrect');
                        btn.innerHTML = `<span>${opt}</span><span class="marker-icon">✕</span>`;
                    }
                } else {
                    btn.onclick = () => {
                        sessionAnswers[q.id] = { status: 'answered', selected: [opt] };
                        renderQuestion();
                        checkCurrentAnswer();
                    };
                }
                container.appendChild(btn);
            });
            area.appendChild(container);

        } else if (q.type === 'multi') {
            let container = document.createElement('div');
            container.className = 'options-container';
            q.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                
                let isSelected = ans.selected && ans.selected.includes(opt);
                if (isSelected) btn.classList.add('selected');
                
                let innerHtml = `<div class="checkbox-mock"></div><span>${opt}</span>`;
                
                if (isChecked) {
                    btn.disabled = true;
                    btn.classList.add('disabled');
                    let isCorrectOpt = q.correct.includes(opt);
                    
                    // Логика отображения для множественного выбора
                    if (isCorrectOpt) {
                        btn.classList.add('correct');
                        innerHtml += `<span class="marker-icon" style="color:var(--success)">✓</span>`;
                    } else if (isSelected && !isCorrectOpt) {
                        btn.classList.add('incorrect');
                        innerHtml += `<span class="marker-icon" style="color:var(--error)">✕</span>`;
                    }
                } else {
                    btn.onclick = () => {
                        let currSelected = ans.selected || [];
                        if (currSelected.includes(opt)) {
                            currSelected = currSelected.filter(o => o !== opt);
                        } else {
                            currSelected.push(opt);
                        }
                        sessionAnswers[q.id] = { status: currSelected.length > 0 ? 'answered' : 'unanswered', selected: currSelected };
                        renderQuestion();
                    };
                }
                btn.innerHTML = innerHtml;
                container.appendChild(btn);
            });
            area.appendChild(container);

        } else if (q.type === 'dropdown') {
            let div = document.createElement('div');
            // Replace [1], [2] with placeholders for visual
            div.innerHTML = q.text.replace(/\[\d\]/g, '<span style="color:var(--primary); font-weight:bold;">[...]</span>');
            area.appendChild(div);
            
            q.blanks.forEach((blank, i) => {
                let block = document.createElement('div');
                block.className = 'dropdown-block';
                
                let sel = document.createElement('select');
                sel.id = `blank-${q.id}-${i}`;
                
                // Добавляем пустой дефолтный вариант
                let defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.innerText = "— Выберите вариант ответа —";
                defaultOpt.disabled = true;
                defaultOpt.selected = !(ans.selected && ans.selected[i]);
                sel.appendChild(defaultOpt);

                let opts = shuffle(blank.options);
                opts.forEach(o => {
                    let option = document.createElement('option');
                    option.value = o;
                    option.innerText = o;
                    if (ans.selected && ans.selected[i] === o) option.selected = true;
                    sel.appendChild(option);
                });
                
                if (isChecked) {
                    sel.disabled = true;
                    let isCorr = ans.selected[i] === blank.correct;
                    sel.className = isCorr ? 'correct-select' : 'incorrect-select';
                    if (!isCorr) {
                        let hint = document.createElement('span');
                        hint.className = 'dropdown-hint';
                        hint.innerText = `Правильно: ${blank.correct}`;
                        block.appendChild(hint);
                    }
                } else {
                    sel.onchange = () => {
                        let curr = sessionAnswers[q.id] ? sessionAnswers[q.id].selected : [];
                        curr[i] = sel.value;
                        sessionAnswers[q.id] = { status: 'answered', selected: curr };
                    };
                }
                block.appendChild(sel);
                area.appendChild(block);
            });

        } else if (q.type === 'matching') {
            let container = document.createElement('div');
            q.pairs.forEach((pair, idx) => {
                let row = document.createElement('div');
                row.className = 'match-row';
                
                if (isChecked) {
                    if (ans.selected[idx] === pair.right) row.classList.add('is-correct');
                    else row.classList.add('has-error');
                }

                let term = document.createElement('span');
                term.className = 'term';
                term.innerText = pair.left;
                
                let sel = document.createElement('select');
                
                // Default empty option
                let defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.innerText = "— Выбрать —";
                defaultOpt.disabled = true;
                defaultOpt.selected = !(ans.selected && ans.selected[idx]);
                sel.appendChild(defaultOpt);

                let opts = shuffle(q.pairs.map(p => p.right));
                opts.forEach(o => {
                    let option = document.createElement('option');
                    option.value = o;
                    option.innerText = o;
                    if (ans.selected && ans.selected[idx] === o) option.selected = true;
                    sel.appendChild(option);
                });

                if (isChecked) {
                    sel.disabled = true;
                    if (ans.selected[idx] !== pair.right) {
                        let hint = document.createElement('span');
                        hint.style.fontSize = '13px';
                        hint.style.color = 'var(--success)';
                        hint.style.fontWeight = '600';
                        hint.innerText = ` (${pair.right})`;
                        sel.parentNode.insertBefore(hint, sel.nextSibling);
                    }
                } else {
                    sel.onchange = () => {
                        let curr = sessionAnswers[q.id] ? sessionAnswers[q.id].selected : [];
                        curr[idx] = sel.value;
                        sessionAnswers[q.id] = { status: 'answered', selected: curr };
                    };
                }
                row.appendChild(term);
                row.appendChild(sel);
                container.appendChild(row);
            });
            area.appendChild(container);

        } else if (q.type === 'sequence') {
            let container = document.createElement('div');
            q.items.forEach((item, idx) => {
                let row = document.createElement('div');
                row.className = 'sequence-row';
                
                let isCorr = ans.selected && ans.selected[idx] === (q.items.indexOf(item) + 1);
                if (isChecked) {
                    row.classList.add(isCorr ? 'is-correct' : 'has-error');
                }

                let sel = document.createElement('select');
                sel.className = 'num-select';
                
                let defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.innerText = "-";
                defaultOpt.disabled = true;
                defaultOpt.selected = !(ans.selected && ans.selected[idx]);
                sel.appendChild(defaultOpt);

                for (let i = 1; i <= q.items.length; i++) {
                    let option = document.createElement('option');
                    option.value = i;
                    option.innerText = i;
                    if (ans.selected && ans.selected[idx] == i) option.selected = true;
                    sel.appendChild(option);
                }

                let text = document.createElement('span');
                text.className = 'text';
                text.innerText = item;

                if (isChecked) {
                    sel.disabled = true;
                    if (!isCorr) {
                        let hint = document.createElement('span');
                        hint.style.fontSize = '13px';
                        hint.style.color = 'var(--success)';
                        hint.style.fontWeight = '600';
                        hint.innerText = ` (Позиция ${q.items.indexOf(item) + 1})`;
                        text.appendChild(hint);
                    }
                } else {
                    sel.onchange = () => {
                        let curr = sessionAnswers[q.id] ? sessionAnswers[q.id].selected : [];
                        curr[idx] = parseInt(sel.value);
                        sessionAnswers[q.id] = { status: 'answered', selected: curr };
                    };
                }
                row.appendChild(sel);
                row.appendChild(text);
                container.appendChild(row);
            });
            area.appendChild(container);

        } else if (q.type === 'category') {
            let container = document.createElement('div');
            q.items.forEach((item, idx) => {
                let row = document.createElement('div');
                row.className = 'match-row';
                
                let isCorr = ans.selected && ans.selected[idx] === item.cat;
                if (isChecked) {
                    row.classList.add(isCorr ? 'is-correct' : 'has-error');
                }

                let text = document.createElement('span');
                text.className = 'term';
                text.innerText = item.text;
                
                let sel = document.createElement('select');
                
                let defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.innerText = "— Выбрать —";
                defaultOpt.disabled = true;
                defaultOpt.selected = !(ans.selected && ans.selected[idx]);
                sel.appendChild(defaultOpt);

                q.categories.forEach(cat => {
                    let option = document.createElement('option');
                    option.value = cat;
                    option.innerText = cat;
                    if (ans.selected && ans.selected[idx] === cat) option.selected = true;
                    sel.appendChild(option);
                });

                if (isChecked) {
                    sel.disabled = true;
                    if (!isCorr) {
                        let hint = document.createElement('span');
                        hint.style.fontSize = '13px';
                        hint.style.color = 'var(--success)';
                        hint.style.fontWeight = '600';
                        hint.innerText = ` (${item.cat})`;
                        sel.parentNode.insertBefore(hint, sel.nextSibling);
                    }
                } else {
                    sel.onchange = () => {
                        let curr = sessionAnswers[q.id] ? sessionAnswers[q.id].selected : [];
                        curr[idx] = sel.value;
                        sessionAnswers[q.id] = { status: 'answered', selected: curr };
                    };
                }
                row.appendChild(text);
                row.appendChild(sel);
                container.appendChild(row);
            });
            area.appendChild(container);
        }

        // Feedback
        let fb = document.getElementById('feedback-box');
        fb.classList.add('hidden');
        if (isChecked && !isExamMode) {
            fb.className = `feedback-box ${ans.isCorrect ? 'correct' : 'incorrect'}`;
            fb.innerHTML = `
                <div class="feedback-title ${ans.isCorrect ? 'correct' : 'incorrect'}">
                    ${ans.isCorrect ? '✓ Верно' : '✕ Неверно'}
                </div>
                <div class="feedback-text">${q.explanation || ''}</div>
            `;
            fb.classList.remove('hidden');
        }

        // Buttons
        document.getElementById('btn-prev').style.display = currentIndex > 0 ? 'block' : 'none';
        document.getElementById('btn-skip').style.display = (!isChecked && !isExamMode) ? 'block' : 'none';
        
        let btnCheck = document.getElementById('btn-check');
        let btnNext = document.getElementById('btn-next');
        
        btnCheck.classList.add('hidden');
        btnNext.classList.add('hidden');

        if (isChecked) {
            btnNext.classList.remove('hidden');
            btnNext.innerText = (currentIndex === currentQuestions.length - 1) ? 'Завершить' : 'Далее';
        } else if (q.type === 'single') {
            // Auto checked
        } else {
            btnCheck.classList.remove('hidden');
        }
    }

    // --- CHECKING LOGIC ---
    function checkCurrentAnswer() {
        let q = currentQuestions[currentIndex];
        let ans = sessionAnswers[q.id];
        if (!ans || ans.status === 'unanswered') return alert("Выберите ответ!");
        
        // Check if all blanks are filled
        if (q.type === 'dropdown' && ans.selected.length !== q.blanks.length) return alert("Заполните все пропуски!");
        if (q.type === 'matching' && ans.selected.length !== q.pairs.length) return alert("Сопоставьте все элементы!");
        if (q.type === 'sequence' && ans.selected.length !== q.items.length) return alert("Укажите позиции для всех элементов!");
        if (q.type === 'category' && ans.selected.length !== q.items.length) return alert("Распределите все элементы по категориям!");

        let isCorrect = false;
        
        if (q.type === 'single') {
            isCorrect = ans.selected[0] === q.correct;
        } else if (q.type === 'multi') {
            // Строгое совпадение: выбраны все правильные и нет лишних
            let s = ans.selected.sort();
            let c = q.correct.slice().sort();
            isCorrect = s.length === c.length && s.every((val, index) => val === c[index]);
        } else if (q.type === 'dropdown') {
            isCorrect = q.blanks.every((b, i) => ans.selected[i] === b.correct);
        } else if (q.type === 'matching') {
            isCorrect = q.pairs.every((p, i) => ans.selected[i] === p.right);
        } else if (q.type === 'sequence') {
            isCorrect = q.items.every((item, i) => ans.selected[i] === (q.items.indexOf(item) + 1));
        } else if (q.type === 'category') {
            isCorrect = q.items.every((item, i) => ans.selected[i] === item.cat);
        }

        ans.status = isCorrect ? 'correct' : 'incorrect';
        ans.isCorrect = isCorrect;
        
        updateGlobalStats(q.id, isCorrect);
        renderQuestion();
    }

    // --- STATS ---
    function updateGlobalStats(qId, isCorrect) {
        let stats = getStats();
        if (isCorrect) stats.totalCorrect++;
        else stats.totalWrong++;
        
        if (!stats.history[qId]) stats.history[qId] = { correct: 0, wrong: 0, lastCorrect: null };
        if (isCorrect) stats.history[qId].correct++;
        else stats.history[qId].wrong++;
        stats.history[qId].lastCorrect = isCorrect;
        
        saveStats(stats);
    }

    // --- NAVIGATION ---
    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= currentQuestions.length) finishQuiz();
        else renderQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function skipQuestion() {
        nextQuestion(); 
    }

    function toggleHard() {
        let q = currentQuestions[currentIndex];
        let stats = getStats();
        let idx = stats.hard.indexOf(q.id);
        if (idx > -1) stats.hard.splice(idx, 1);
        else stats.hard.push(q.id);
        saveStats(stats);
        renderQuestion();
    }

    function finishEarly() {
        if (confirm("Вы уверены, что хотите завершить?")) finishQuiz();
    }

    // --- FINISH ---
    function finishQuiz() {
        showScreen('results-screen');
        
        let total = currentQuestions.length;
        let correctCount = 0;
        let incorrectCount = 0;
        let skippedCount = 0;
        let uncheckedCount = 0;
        let errorsHtml = '';

        currentQuestions.forEach(q => {
            let ans = sessionAnswers[q.id] || { status: 'unanswered' };
            
            if (ans.status === 'correct') {
                correctCount++;
            } else if (ans.status === 'incorrect') {
                incorrectCount++;
                errorsHtml += `<div class="error-item">
                    <div class="error-q">${q.text}</div>
                    <div class="error-ans">
                        <span>Ваш ответ: Неверно</span>
                        <span class="correct">Правильно: ${getCorrectAnswerText(q)}</span>
                        <span style="font-size:13px; margin-top:4px; color:var(--text-muted);">${q.explanation || ''}</span>
                    </div>
                </div>`;
            } else if (ans.status === 'answered') {
                uncheckedCount++;
                errorsHtml += `<div class="error-item">
                    <div class="error-q">${q.text}</div>
                    <div class="error-ans">
                        <span style="color: var(--text-muted);">Не проверено</span>
                        <span class="correct">Правильно: ${getCorrectAnswerText(q)}</span>
                    </div>
                </div>`;
            } else {
                skippedCount++;
                errorsHtml += `<div class="error-item">
                    <div class="error-q">${q.text}</div>
                    <div class="error-ans">
                        <span>Пропущено</span>
                        <span class="correct">Правильно: ${getCorrectAnswerText(q)}</span>
                    </div>
                </div>`;
            }
        });

        let checkedTotal = correctCount + incorrectCount;
        let percent = checkedTotal > 0 ? Math.round((correctCount / checkedTotal) * 100) : 0;

        document.getElementById('res-percent').innerText = `${percent}%`;
        document.getElementById('res-subtitle').innerText = `Результат (${correctCount} из ${checkedTotal} проверенных)`;
        
        document.getElementById('res-correct').innerText = correctCount;
        document.getElementById('res-incorrect').innerText = incorrectCount;
        document.getElementById('res-skipped').innerText = skippedCount;
        document.getElementById('res-unchecked').innerText = uncheckedCount;

        if (errorsHtml) {
            document.getElementById('result-errors-container').classList.remove('hidden');
            document.getElementById('result-errors').innerHTML = errorsHtml;
        } else {
            document.getElementById('result-errors-container').classList.add('hidden');
        }
    }

    function getCorrectAnswerText(q) {
        if (q.type === 'single') return q.correct;
        if (q.type === 'multi') return q.correct.join(', ');
        if (q.type === 'dropdown') return q.blanks.map(b => b.correct).join(', ');
        if (q.type === 'matching') return q.pairs.map(p => `${p.left} → ${p.right}`).join('; ');
        if (q.type === 'sequence') return q.items.map((item, i) => `${i+1}. ${item}`).join('; ');
        if (q.type === 'category') return q.items.map(item => `${item.text} → ${item.cat}`).join('; ');
        return '';
    }

    function resetProgress() {
        if (confirm("Сбросить весь прогресс? Это действие необратимо.")) {
            localStorage.removeItem('im_stats_v3');
            initMenu();
        }
    }

    // --- START ---
    window.onload = initMenu;
</script>
</body>
</html>
